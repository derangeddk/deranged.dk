layout: default

{% include overlay_nav.html %}

<style type="text/css" scoped>
    .header {
        background: rgba(52, 73, 94, 1.0);
        display: grid;
        grid-template-columns: 150px 1fr;
        color: #eaf1f7;
        padding: 30px;
        text-align: left;
    }

    .header .logo {
        color: inherit;
        text-decoration: inherit;
        font-weight: 200;
        font-size: 1.3em;
        position: relative;
        z-index: 11;
    }

    .header h1 {
        margin: 0;
        padding: 0;
        margin-top: -9px;
        font-weight: 200;
        font-size: 3em;
    }

    .header h1 a {
        color: inherit;
        text-decoration: inherit;
    }

    .explainer-logo {
        display: inline-block;
        transform: translate(-5px, -13px) scale(0.4);
    }

    @media (max-width: 600px) {
        .header {
            grid-template-columns: 1fr;
        }
    }
</style>
<section class="header">
    <a href="/" class="logo">deranged</a>
    <h1><a href="/explainers">explainers<span class="explainer-logo">?</span></a></h1>
</section>

<style>
    .main-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        margin-bottom: 4em;
    }
    .main-content h1 {
        text-align: left;
        margin: 2em;
        margin-left: 175px;
        margin-bottom: 1em;
        margin-right: 25px;
        font-size: 4em;
    }
    h1 strong {
        font-weight: bold;
    }
    .main-content section > h2 {
        margin-bottom: 1em;
        margin-top: 4em;
        padding-right: 25px;
        font-size: 2em;
        font-weight: 200;
        margin-left: 175px;
        position: relative;
        max-width: 700px;
        color: #ecf0f1;
        z-index: 2;
    }
    .main-content section > h2:before {
        content: '';
        background-image: linear-gradient(40deg, #2c3e50 30%, #455d75 90%);
        width: calc(100% + 25px);
        max-width: 750px;
        position: absolute;
        top: -0.25em;
        bottom: -0.25em;
        left: 0;
        z-index: -1;
        transform: translate(-25px, -2px) rotate(-0.5deg);
    }
    .main-content section > p {
        margin-left: 175px;
        max-width: 650px;
    }
    .main-content > section {
        width: 100%;
        box-sizing: border-box;
    }
    .main-content > section.explainer-description {
        display: flex;
        margin-left: 150px;
        margin-bottom: 4em;
        width: auto;
        font-size: 1em;
    }
    .main-content > section.explainer-description .teaser {
        background-color: #2c3e50;
        background-image: linear-gradient(40deg, #2c3e50 30%, #455d75 90%);
        padding: 25px;
        color: #ecf0f1;
    }
    .main-content .teaser p {
        font-size: 1.1em;
        max-width: 700px;
        margin-left: 0;
    }
    .main-content .teaser p:last-child {
        margin-bottom: 0;
    }
    .main-content .author {
        font-size: 0.7em;
        padding: 25px;
        color: #84969b;
    }
    .main-content .author a {
        color: inherit;
    }

    @media (max-width: 1250px) {
        .main-content > section.explainer-description {
            flex-direction: column;
        }
    }
    @media (max-width: 1100px) {
        .main-content h1 {
            margin-left: 20px;
        }
        .main-content > section.explainer-description {
            margin-left: 0;
        }
        .main-content section > h2 {
            margin-left: 20px;
        }
        .main-content section > p {
            margin-left: 20px;
        }
    }
    @media (max-width: 950px) {
        .main-content h1 {
            font-size: 3.5em;
        }
        .main-content h1 br {
            display: none;
        }
    }
    @media (max-width: 600px) {
        .main-content h1 {
            font-size: 3em;
        }
    }
    @media (max-width: 450px) {
        .main-content {
            font-size: 1.1em;
        }
    }

    .main-content a {
        color: #2c3e50;
    }
</style>

<main class="main-content">
    {{ content }}
</main>
