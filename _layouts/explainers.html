---
layout: default
---
{% include overlay_nav.html %}

<main class="explainer">
    <style scoped>
        .explainer__intro {
            display: flex;
            flex-direction: column;
            align-items: start;
            margin-left: 100px;
            text-align: left;
            padding-bottom: 100px;
        }
        .explainer__intro-heading {
            font-size: 6rem;
            margin-bottom: 10rem;
            margin-top: 6rem;
        }

        .explainer-description {
            display: flex;
            margin-left: -3rem;
            width: auto;
        }
        .explainer-description .teaser {
            background-color: #2c3e50;
            padding: 3rem;
            color: #ecf0f1;
            box-shadow: 0 6px 5px rgba(0,0,0,0.2), 0 4px 3px rgba(0,0,0,0.05);
        }
        .teaser p:last-child {
            margin-bottom: 0;
        }
        .author {
            font-size: 0.7em;
            padding: 25px;
            color: rgba(255,255,255,0.7);
        }
        .author a {
            color: inherit;
        }
    </style>
<section class="section--dark section--dark-darken-gradient">
    <div class="header" role="banner">
        <a href="/" class="logo">deranged</a>
        <a class="site-area-logo explainers-logo" role="heading" aria-level="1" href="/explainers">explainers&nbsp;</a>
    </div>

    <div class="explainer__intro">
        <h1 class="explainer__intro-heading display-1">{% if page.title_display %}{{ page.title_display }}{% else %}{{ page.title }}{% endif %}</h1>
    </div>
</section>

<style>
    .explainer__teaser {
        display: flex;
        flex-direction: column;
        align-items: start;
        margin-left: 102px;
        text-align: left;
        margin-top: -125px;
    }
    .explainer {
        display: flex;
        flex-direction: column;
        align-items: stretch;
    }
    .longform--explainer {
        padding: 4.5rem 4rem;
        position: relative;
        z-index: 2;
        margin-left: calc(100px - 4rem);
        display: flex;
        align-items: start;
        flex-direction: column;
    }
    .longform--explainer .container {
        padding-right: 115px;
    }
    .main-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        margin-bottom: 4em;
    }
    .main-content h1 {
        text-align: left;
        margin-bottom: 1em;
        margin-right: 25px;
        font-size: 4em;
    }
    .main-content section > h2 {
        margin-bottom: 1em;
        margin-top: 4em;
        padding-right: 25px;
        font-size: 2em;
        font-weight: 200;
        position: relative;
        max-width: 700px;
        color: #ecf0f1;
        z-index: 2;
    }
    .main-content section > h2:before {
        content: '';
        background-image: linear-gradient(40deg, #2c3e50 30%, #455d75 90%);
        width: calc(100% + 25px);
        max-width: 750px;
        position: absolute;
        top: -0.25em;
        bottom: -0.25em;
        left: 0;
        z-index: -1;
        transform: translate(-25px, -2px) rotate(-0.5deg);
    }

    @media (max-width: 1250px) {
        .main-content > section.explainer-description {
            flex-direction: column;
        }
    }
    @media (max-width: 1100px) {
        .main-content h1 {
            margin-left: 20px;
        }
        .main-content > section.explainer-description {
            margin-left: 0;
        }
        .main-content section > h2 {
            margin-left: 20px;
        }
        .main-content section > p {
            margin-left: 20px;
        }
    }
    @media (max-width: 950px) {
        .main-content h1 {
            font-size: 3.5em;
        }
        .main-content h1 br {
            display: none;
        }
    }
    @media (max-width: 600px) {
        .main-content h1 {
            font-size: 3em;
        }
    }
    @media (max-width: 450px) {
        .main-content {
            font-size: 1.1em;
        }
    }

    .main-content a {
        color: #2c3e50;
    }
</style>
    <div class="explainer__teaser">
        <div class="explainer-description longform">
            <div class="teaser container">
                {{ page.teaser }}
            </div>
            <div class="author">
                {{ page.author }}
            </div>
        </div>
    </div>
    <div class="longform longform--explainer">
        {{ content }}
    </div>
</main>
