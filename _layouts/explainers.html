---
layout: default
---
{% include overlay_nav.html %}
<style scoped>
    .explainer-wrapper {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
    }

    .explainer__intro {
        display: flex;
        flex-direction: column;
        align-items: start;
        text-align: left;
        padding-bottom: 100px;
        padding: 3rem 1.5rem;

        @media(min-width: 768px) {
            padding-top: 0;
            padding-left: 4rem;
            padding-right: 4rem;
        }
    }

    .explainer__intro-heading {
        margin-top: 0;
        margin-bottom: 2rem;
        max-width: 1125px;
    }

    .explainer__intro-subtitle {
        font-size: 1.55rem;
        max-width: 1125px;
    }

    .explainer-description {
        display: flex;
        width: auto;
        flex-direction: column-reverse;

        @media(min-width: 768px) {
            margin-left: -3rem;
            flex-direction: row;
        }
    }

    .explainer-description .teaser {
        background-color: #2c3e50;
        padding: 3rem;
        color: #ecf0f1;
        box-shadow: 0 6px 5px rgba(0,0,0,0.2), 0 4px 3px rgba(0,0,0,0.05);
    }

    .teaser p:last-child {
        margin-bottom: 0;
    }

    .author {
        font-size: 0.9em;
        color: rgba(255,255,255,0.7);
    }

    .author a {
        color: inherit;
    }

    .explainer__teaser {
        display: flex;
        flex-direction: column;
        align-items: start;
        text-align: left;

        @media(min-width: 768px) {
            margin-left: 102px;
            margin-top: -125px;
        }
    }

    .explainer {
        display: flex;
        flex-direction: column;
        align-items: stretch;

        @media(min-width: 1200px) {
            /* Add Padding-bottom to make space for bottom ↯ symbol */
            padding-bottom: 6rem;
        }
    }

    .longform--explainer {
        padding: 3rem 1.5rem;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: start;
        flex-direction: column;

        @media(min-width: 768px) {
            padding: 4.5rem 4rem;
        }
    }

    .main-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        margin-bottom: 4em;
    }

    .main-content h1 {
        text-align: left;
        margin-bottom: 1em;
        margin-right: 25px;
        font-size: 4em;
    }

    .main-content section > h2 {
        margin-bottom: 1em;
        margin-top: 4em;
        padding-right: 25px;
        font-size: 2em;
        font-weight: 200;
        position: relative;
        max-width: 700px;
        color: #ecf0f1;
        z-index: 2;
    }

    .main-content section > h2:before {
        content: '';
        background-image: linear-gradient(40deg, #2c3e50 30%, #455d75 90%);
        width: calc(100% + 25px);
        max-width: 750px;
        position: absolute;
        top: -0.25em;
        bottom: -0.25em;
        left: 0;
        z-index: -1;
        transform: translate(-25px, -2px) rotate(-0.5deg);
    }

    @media (max-width: 1250px) {
        .main-content > section.explainer-description {
            flex-direction: column;
        }
    }

    @media (max-width: 1100px) {
        .main-content h1 {
            margin-left: 20px;
        }
        .main-content > section.explainer-description {
            margin-left: 0;
        }
        .main-content section > h2 {
            margin-left: 20px;
        }
        .main-content section > p {
            margin-left: 20px;
        }
    }
    @media (max-width: 950px) {
        .main-content h1 {
            font-size: 3.5em;
        }
        .main-content h1 br {
            display: none;
        }
    }
    @media (max-width: 600px) {
        .main-content h1 {
            font-size: 3em;
        }
    }
    @media (max-width: 450px) {
        .main-content {
            font-size: 1.1em;
        }
    }

    .main-content a {
        color: #2c3e50;
    }
</style>

<main class="explainer">
    <section class="section--dark section--dark-darken-gradient">
        <div class="header" role="banner">
            <a href="/" class="logo">
                deranged
            </a>
            <a class="site-area-logo explainers-logo" role="heading" aria-level="1" href="/explainers">
                explainers&nbsp;
            </a>
        </div>
        <div class="explainer__intro explainer-wrapper" id="first-content">
            <h1 class="explainer__intro-heading display-1 display-1--xl">
                {% if page.title_display %}
                    {{ page.title_display }}
                {% else %}
                    {{ page.title }}
                {% endif %}
            </h1>
            <div class="explainer__intro-subtitle">
                {{ page.teaser }}
            </div>
            {% if page.author %}
                <div class="author">
                    {{ page.author }}
                </div>
            {% endif %}
        </div>
    </section>
    <div class="longform longform--explainer explainer-wrapper">
        {{ content }}
    </div>
</main>
