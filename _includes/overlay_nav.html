<a href="#first-content" class="skip-to-main-content-link">Skip to main content</a>
<button id="main-nav-toggle" onClick="handleNav()" aria-label="Menu" aria-controls="main-nav">
  <div class="icon-bar"></div>
  <div class="icon-bar"></div>
  <div class="icon-bar"></div>
</button>
<nav id="main-nav" class="main-nav overlay">
  <div class="main-nav-menu hidden" id="main-nav-menu">
    {% include menu_links.html %}
  </div>
</nav>

<script>
  function handleNav() {
    var classes = document.getElementById('main-nav-menu').classList;
    if (classes.contains("hidden")) {
      document.getElementById('main-nav-menu').classList.toggle('hidden');
      var start = null;
      function startAnim(timestamp) {
        if(!start) start = timestamp;
        var progress = timestamp - start;
        if (progress = 1) {
          document.querySelector("body").classList.toggle("main-nav-open");
        }
      }
      window.requestAnimationFrame(startAnim);
    } else {
      document.querySelector("body").classList.toggle("main-nav-open");
      setTimeout(() => {
        document.getElementById('main-nav-menu').classList.toggle('hidden');
      }, 300);
      
    };
  };
</script>
